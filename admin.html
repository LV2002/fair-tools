<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard | afdindia Design College Fair</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--cream:#f6f3ea;--ink:#17171d;--pink:#ec3f72;--lime:#a8d46c;--tan:#d6c9a0;--olive:#7d845c;--orange:#d4965a;--line:#ddd6c2;--muted:#5d5d68;--ok:#2e9e4f;--bad:#d62b4f}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
.strip{height:6px;display:grid;grid-template-columns:repeat(4,1fr)}.strip i:nth-child(1){background:var(--orange)}.strip i:nth-child(2){background:var(--tan)}.strip i:nth-child(3){background:var(--pink)}.strip i:nth-child(4){background:var(--olive)}
header{background:var(--ink);color:#fff;padding:12px clamp(14px,3vw,28px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:15px;letter-spacing:.04em}header small{color:var(--tan);display:block;font-size:12px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;font:700 13px Poppins,sans-serif;color:var(--ink);background:var(--lime);cursor:pointer;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff}.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px;box-shadow:0 2px 0 var(--ink)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.btn:disabled{opacity:.5}
header .btn{border-color:#fff;box-shadow:0 3px 0 #fff}
input,select,textarea{padding:10px 12px;background:#fff;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font:500 14px Poppins,sans-serif;max-width:100%}
input:focus,select:focus{outline:3px solid rgba(236,63,114,.3);border-color:var(--pink)}
nav.tabs{display:flex;gap:6px;padding:12px clamp(14px,3vw,28px) 0;overflow-x:auto;border-bottom:2px solid var(--ink);background:var(--cream);position:sticky;top:0;z-index:4}
nav.tabs button{border:2px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;background:#fff;padding:10px 16px;font:700 13px Poppins,sans-serif;cursor:pointer;white-space:nowrap;color:var(--muted)}
nav.tabs button.on{background:var(--ink);color:#fff}
main{padding:clamp(14px,2.4vw,26px) clamp(14px,3vw,28px) 60px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;border-top:6px solid var(--pink)}
.kpi:nth-child(4n+2){border-top-color:var(--ink)}.kpi:nth-child(4n+3){border-top-color:var(--olive)}.kpi:nth-child(4n+4){border-top-color:var(--orange)}
.kpi .n{font-size:28px;font-weight:800;line-height:1.1}.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.cols{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.box{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:16px 18px;min-width:0}
.box h3{font-size:15px;margin-bottom:2px}.box .hint{color:var(--muted);font-size:12px;margin-bottom:10px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .t{height:16px;background:#efeadb;border-radius:9px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--pink);border-radius:9px;min-width:2px}
.bar.alt .t i{background:var(--ink)}.bar.ol .t i{background:var(--olive)}
.bar span.v{font-weight:700;white-space:nowrap}
.funnel .bar .t{height:22px}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:1px;min-width:4px;height:100%}
.days i{display:block;border-radius:3px 3px 0 0}.days i.v{background:#d9d2ba}.days i.r{background:var(--pink)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.tw{overflow:auto;border:2px solid var(--ink);border-radius:14px;background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:9px 10px;font-weight:700;white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fbf8ef}
tr.click{cursor:pointer}
td.n,th.n{text-align:right}
.tag{display:inline-block;background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e1f5e7;border-color:var(--ok);color:#1c6b36}.tag.pk{background:#fde3ec;border-color:var(--pink);color:var(--pink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(23,23,29,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.open{display:flex}
.modal .sheet{background:var(--cream);border:3px solid var(--ink);border-radius:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px 22px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin-top:10px}.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;word-break:break-word}
.login{max-width:420px;margin:60px auto;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:24px;box-shadow:8px 8px 0 var(--pink)}
.login label{display:block;font-weight:600;margin:14px 0 5px;font-size:13px}.login input{width:100%}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
code{background:#efeadb;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.note{background:#fff8e1;border:1.5px dashed var(--ink);border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
</style>
</head>
<body>
<div class="strip"><i></i><i></i><i></i><i></i></div>
<header>
  <div><b>DESIGN COLLEGE FAIR 2026 · STUDENT DASHBOARD</b><small id="stamp">Not signed in</small></div>
  <div class="hr hide" id="hdrBtns" style="display:none">
    <label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="auto" style="width:auto"> auto-refresh</label>
    <button class="btn ghost sm" id="refBtn">↻ Refresh</button>
    <button class="btn ghost sm" id="outBtn">Sign out</button>
  </div>
</header>

<div id="loginView"><div class="login">
  <h2 style="font-size:20px">Admin sign in</h2>
  <p class="muted" style="margin-top:4px">Enter the admin key you set in the Apps Script.</p>
  <div id="urlRow" style="display:none"><label>Script URL</label><input id="inUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="none"></div>
  <label>Admin key</label><input id="inKey" type="password" autocomplete="off" autocapitalize="none">
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="rem" style="width:auto" checked> Remember on this device</label>
  <div class="err" id="loginErr"></div>
  <button class="btn" id="goBtn" style="margin-top:16px;width:100%">Open dashboard</button>
</div></div>

<div id="appView" style="display:none">
  <nav class="tabs" id="tabs"></nav>
  <main id="tab"></main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const CONFIG={ SCRIPT_URL:'https://script.google.com/macros/s/AKfycbxTbs4soc9dgS8iT27IAcKj4nPns5QpQcDeYngWGxpCgdeSACh94J9SepRhonZ-x1ZMUA/exec' };
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let URL_=CONFIG.SCRIPT_URL, KEY='', D=null, tab='overview', timer=null;
const ST={rq:'',rsrc:'',rrole:'',rstat:'',vsrc:'',vreg:'',vmax:200,gate:''};

if(/^PASTE/.test(URL_)){ URL_=LS.get('afd_a_url')||''; $('#urlRow').style.display='block'; $('#inUrl').value=URL_; }
$('#inKey').value=LS.get('afd_a_key')||'';

async function api(a,extra){
  const res=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a,key:KEY,by:'Admin'},extra||{}))});
  const out=await res.json(); if(!out.ok) throw new Error(out.error||'Failed'); return out;
}
async function load(){
  D=await api('dash');
  D.visits.forEach(v=>{ v.open=+v.open||0; v.active=+v.active||0; v.scroll=+v.scroll||0; v.step=+v.step||0; v.src=v.src||'direct'; });
  D.students.forEach(s=>{ s.party=+s.party||1; s.secs_before=+s.secs_before||0; s.src=s.src||'direct'; });
  $('#stamp').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · '+D.students.length+' registrations · '+D.visits.length+' visits';
}
$('#goBtn').onclick=async()=>{
  KEY=$('#inKey').value.trim(); if(!$('#urlRow').style.display||$('#urlRow').style.display==='block') URL_=$('#inUrl').value.trim()||URL_;
  const le=$('#loginErr'); le.textContent=''; if(!KEY||!URL_){ le.textContent='Enter the key'+(URL_?'':' and the script URL')+'.'; return; }
  $('#goBtn').disabled=true; $('#goBtn').textContent='Loading…';
  try{ await load(); if($('#rem').checked){ LS.set('afd_a_key',KEY); if(/^PASTE/.test(CONFIG.SCRIPT_URL)) LS.set('afd_a_url',URL_); }
       $('#loginView').style.display='none'; $('#appView').style.display='block'; $('#hdrBtns').style.display='flex'; draw(); }
  catch(e){ le.textContent=/Wrong key/.test(e.message)?'That key is not right.':e.message; }
  $('#goBtn').disabled=false; $('#goBtn').textContent='Open dashboard';
};
$('#outBtn').onclick=()=>{ LS.del('afd_a_key'); location.reload(); };
$('#refBtn').onclick=async()=>{ $('#refBtn').textContent='…'; try{ await load(); draw(true); }catch(e){ alert(e.message); } $('#refBtn').textContent='↻ Refresh'; };
$('#auto').onchange=e=>{ clearInterval(timer); if(e.target.checked) timer=setInterval(()=>$('#refBtn').click(),30000); };
if(LS.get('afd_a_key')&&URL_) setTimeout(()=>$('#goBtn').click(),50);

/* ---------- helpers ---------- */
const SEC={hero:'Top of page',stats:'Key numbers',why:'Why come',gains:'What you get',day:'Highlights & timings',who:'Who should come',how:'How it works',faq:'FAQ',final:'Final call to action',form:'Registration form'};
const SEC_ORDER=Object.keys(SEC);
const dt=iso=>{ if(!iso) return ''; const d=new Date(iso+'+05:30'); return isNaN(d)?iso:d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const day=iso=>String(iso||'').slice(0,10);
const dur=n=>{ n=Math.round(n||0); return n<60?n+'s':Math.floor(n/60)+'m '+String(n%60).padStart(2,'0')+'s'; };
const pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'-';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function count(list){ const m={}; list.forEach(x=>{ if(x!==''&&x!=null) m[x]=(m[x]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function bars(rows,total,cls){ const mx=Math.max(1,...rows.map(r=>r[1])); return '<div class="bars">'+rows.map(r=>'<div class="bar '+(cls||'')+'"><span title="'+esc(r[0])+'" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r[0])+'</span><div class="t"><i style="width:'+(r[1]/mx*100)+'%"></i></div><span class="v">'+(r[2]!=null?r[2]:r[1]+(total?' · '+pct(r[1],total):''))+'</span></div>').join('')+'</div>'; }
function csv(rows,cols,name){
  const q=v=>{ v=String(v==null?'':v); if(/^[=@]/.test(v)||/^[+\-](?![\d\s.]*$)/.test(v)) v="'"+v; /* neutralise formulas, but keep plain numbers like +919876543210 */ return '"'+v.replace(/"/g,'""')+'"'; };
  const out=[cols.map(c=>q(c[0])).join(',')].concat(rows.map(r=>cols.map(c=>q(typeof c[1]==='function'?c[1](r):r[c[1]])).join(','))).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+out],{type:'text/csv'})); a.download=name+'-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function siteLink(slug,base){ base=base||D.settings.site; if(!base) return ''; return base+(base.includes('?')?'&':'?')+'src='+encodeURIComponent(slug); }
function sessionOf(s){ return D.visits.find(v=>v.sid===s.sid); }
function topSec(v){ const e=Object.entries(v.secs||{}).sort((a,b)=>b[1]-a[1])[0]; return e?(SEC[e[0]]||e[0])+' ('+dur(e[1])+')':''; }

/* ---------- per-source numbers ---------- */
function srcStats(){
  const m={}; const g=k=>m[k]||(m[k]={slug:k,visits:0,vids:new Set(),act:[],form:0,vreg:0,reg:0,chk:0,ppl:0});
  D.visits.forEach(v=>{ const s=g(v.src); s.visits++; s.vids.add(v.vid); if(v.open>=3) s.act.push(v.active); if(v.form==='Y') s.form++; if(v.reg) s.vreg++; });
  D.students.forEach(x=>{ const s=g(x.src); s.reg++; s.ppl+=x.party; if(x._checked==='Yes') s.chk++; });
  D.sources.forEach(c=>g(c.slug));
  return m;
}

/* ---------- tabs ---------- */
const TABS=[['overview','Overview'],['sources','Sources & tracking links'],['regs','Registrations'],['visits','Visits'],['audience','Audience'],['checkin','Check-in']];
function draw(keep){
  $('#tabs').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
  const y=scrollY; $('#tab').innerHTML=VIEW[tab](); if(AFTER[tab]) AFTER[tab](); if(keep) scrollTo(0,y);
}
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tab]'); if(t){ tab=t.dataset.tab; draw(); scrollTo(0,0); } });

const VIEW={}, AFTER={};

/* ===== Overview ===== */
VIEW.overview=()=>{
  const V=D.visits, S=D.students, uniq=new Set(V.map(v=>v.vid)).size, real=V.filter(v=>v.open>=3);
  const chk=S.filter(s=>s._checked==='Yes'), people=S.reduce((a,s)=>a+s.party,0), pchk=chk.reduce((a,s)=>a+s.party,0);
  const web=S.filter(s=>s._via!=='Walk-in');
  const kp=(n,l,s)=>'<div class="kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
  // daily
  const days={}; V.forEach(v=>{ const k=day(v.first); (days[k]=days[k]||{v:0,r:0}).v++; }); S.forEach(s=>{ const k=day(s.ts); (days[k]=days[k]||{v:0,r:0}).r++; });
  const keys=Object.keys(days).sort().slice(-45), mxV=Math.max(1,...keys.map(k=>days[k].v)), mxR=Math.max(1,...keys.map(k=>days[k].r));
  const chart=keys.length?'<div class="days">'+keys.map(k=>'<div title="'+k+': '+days[k].v+' visits, '+days[k].r+' registrations"><i class="r" style="height:'+(days[k].r/Math.max(mxV,mxR)*100)+'%"></i><i class="v" style="height:'+(days[k].v/Math.max(mxV,mxR)*100)+'%"></i></div>').join('')+'</div><div class="legend"><span><b style="background:#d9d2ba"></b>Visits</span><span><b style="background:var(--pink)"></b>Registrations</span><span>'+keys[0]+' to '+keys[keys.length-1]+'</span></div>':'<div class="empty">No data yet.</div>';
  // funnel
  const f=[['Visited the website',V.length],['Read more than half the page',V.filter(v=>v.scroll>=50).length],['Clicked a register button',V.filter(v=>Object.keys(v.clicks||{}).some(k=>k!=='whatsapp')).length],['Opened the form',V.filter(v=>v.form==='Y').length],['Reached form step 2',V.filter(v=>v.step>=2).length],['Reached form step 3',V.filter(v=>v.step>=3).length],['Registered',V.filter(v=>v.reg).length],['Came on the day (checked in)',web.filter(s=>s._checked==='Yes').length]];
  const funnel='<div class="bars funnel">'+f.map((r,i)=>'<div class="bar alt"><span>'+r[0]+'</span><div class="t"><i style="width:'+(r[1]/Math.max(1,f[0][1])*100)+'%"></i></div><span class="v">'+r[1]+(i?' · '+pct(r[1],f[i-1][1])+' of previous':'')+'</span></div>').join('')+'</div>';
  // sections
  const sec=SEC_ORDER.map(k=>{ const a=real.map(v=>(v.secs||{})[k]||0); return [SEC[k],avg(a),a.filter(x=>x>=3).length]; });
  const mxS=Math.max(1,...sec.map(s=>s[1]));
  const secHtml='<div class="bars">'+sec.map(s=>'<div class="bar ol"><span>'+s[0]+'</span><div class="t"><i style="width:'+(s[1]/mxS*100)+'%"></i></div><span class="v">'+dur(s[1])+' avg · '+pct(s[2],real.length)+' stayed 3s+</span></div>').join('')+'</div>';
  const clicks={}; V.forEach(v=>Object.entries(v.clicks||{}).forEach(([k,n])=>clicks[k]=(clicks[k]||0)+n));
  const top=Object.entries(srcStats()).map(([k,s])=>[k,s.reg,s.reg+' reg · '+s.visits+' visits']).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return '<div class="grid kpis">'+
    kp(S.length,'Registrations',people+' people expected')+kp(V.length,'Visits',uniq+' unique visitors')+
    kp(pct(V.filter(v=>v.reg).length,V.length),'Visit → registration','online conversion')+
    kp(dur(avg(real.map(v=>v.active))),'Avg time reading','of '+real.length+' visits over 3s')+
    kp(dur(avg(web.map(s=>s.secs_before).filter(x=>x>0))),'Avg time before registering','from site visit to sign-up')+
    kp(chk.length,'Checked in',pchk+' people · '+pct(chk.length,S.length)+' of registered')+'</div>'+
    '<div class="grid cols" style="margin-top:14px">'+
    '<div class="box"><h3>Daily visits &amp; registrations</h3><div class="hint">Last 45 days with activity</div>'+chart+'</div>'+
    '<div class="box"><h3>Conversion funnel</h3><div class="hint">Where people drop off between landing and the gate</div>'+funnel+'</div>'+
    '<div class="box"><h3>Which sections hold attention</h3><div class="hint">Average seconds spent in each section, per visit</div>'+secHtml+'</div>'+
    '<div class="box"><h3>Top sources</h3><div class="hint">Registrations by tracking link</div>'+(top.length?bars(top):'<div class="empty">Nothing yet.</div>')+
      '<h3 style="margin-top:16px">Button clicks</h3><div class="hint">Which call-to-action gets used</div>'+(Object.keys(clicks).length?bars(Object.entries(clicks).sort((a,b)=>b[1]-a[1]),0,'alt'):'<div class="empty">No clicks yet.</div>')+'</div>'+
    '<div class="box"><h3>Devices &amp; apps</h3><div class="hint">Visits</div>'+bars(count(V.map(v=>v.device)),V.length)+'<div style="height:10px"></div>'+bars(count(V.map(v=>v.browser)).slice(0,6),V.length,'ol')+'</div>'+
    '</div>';
};

/* ===== Sources & links ===== */
VIEW.sources=()=>{
  const m=srcStats(), made=new Set(D.sources.map(s=>s.slug));
  const rows=Object.values(m).sort((a,b)=>b.reg-a.reg||b.visits-a.visits);
  const site=D.settings.site;
  const tr=rows.map(s=>{
    const c=D.sources.find(x=>x.slug===s.slug);
    const link=siteLink(s.slug), flink=D.settings.form?siteLink(s.slug,D.settings.form):'';
    return '<tr><td><b>'+esc(c?c.label:s.slug)+'</b><div class="muted" style="font-size:11px">'+esc(s.slug)+(c?'':' · not created here')+'</div></td>'+
      '<td>'+(c&&link?'<div class="linkrow"><button class="btn sm" data-copy="'+esc(link)+'">Copy site link</button>'+(flink?'<button class="btn sm ghost" data-copy="'+esc(flink)+'">Copy form link</button>':'')+'<button class="btn sm ghost" data-qr="'+esc(s.slug)+'">QR</button></div>':(c?'<span class="muted">Set the website address above</span>':''))+'</td>'+
      '<td class="n">'+s.visits+'</td><td class="n">'+s.vids.size+'</td><td class="n">'+dur(avg(s.act))+'</td><td class="n">'+s.form+'</td><td class="n"><b>'+s.reg+'</b></td><td class="n">'+(s.visits?pct(s.vreg,s.visits):'-')+'</td><td class="n">'+s.chk+'</td><td class="n">'+(s.reg?pct(s.chk,s.reg):'-')+'</td>'+
      '<td>'+(c?'<button class="btn sm danger" data-delsrc="'+esc(s.slug)+'">Remove</button>':'')+'</td></tr>';
  }).join('');
  return '<div class="note"><b>How it works:</b> create a link for every place you share the fair (Instagram bio, a school, a newspaper ad, a WhatsApp group). Give each place <i>its own</i> link. Everyone who arrives through it is counted against that name: visits, time spent, registrations and how many actually turned up. A link is just your website address plus <code>?src=name</code>.</div>'+
    '<div class="grid cols">'+
    '<div class="box"><h3>1. Your website addresses</h3><div class="hint">Where the student website (and optionally the standalone form) is published, e.g. your Knorish page.</div>'+
      '<label style="font-size:12px;font-weight:600">Student website address</label><input id="setSite" style="width:100%;margin:4px 0 10px" placeholder="https://afdindia.com/page/design-college-fair" value="'+esc(D.settings.site)+'">'+
      '<label style="font-size:12px;font-weight:600">Standalone form address (optional)</label><input id="setForm" style="width:100%;margin:4px 0 10px" placeholder="https://afdindia.com/page/design-college-fair-register" value="'+esc(D.settings.form)+'">'+
      '<button class="btn sm" id="saveSet">Save addresses</button> <span id="setMsg" class="muted"></span></div>'+
    '<div class="box"><h3>2. Create a tracking link</h3><div class="hint">Use a short, clear name. Letters, numbers and dashes only.</div>'+
      '<input id="newName" style="width:100%;margin-bottom:8px" placeholder="e.g. Instagram bio, DPS Kochi, The Hindu ad" maxlength="60">'+
      '<input id="newNote" style="width:100%;margin-bottom:10px" placeholder="Note (optional): who has this link, when it goes out" maxlength="120">'+
      '<div id="newPrev" class="muted" style="margin-bottom:10px;font-size:12px">The link will appear here.</div><button class="btn sm" id="addSrc">Create link</button> <span id="newMsg" class="err"></span></div>'+
    '</div>'+
    '<h3 style="margin:22px 0 8px">3. Results by source</h3>'+
    '<div class="tw"><table><thead><tr><th>Source</th><th>Links</th><th class="n">Visits</th><th class="n">Unique</th><th class="n">Avg time</th><th class="n">Opened form</th><th class="n">Registered</th><th class="n">Visit → reg</th><th class="n">Came</th><th class="n">Show-up</th><th></th></tr></thead><tbody>'+(tr||'<tr><td colspan="11" class="empty">No sources yet.</td></tr>')+'</tbody></table></div>'+
    '<p class="muted" style="margin-top:8px;font-size:12px">"direct" = no link tag (typed address, saved bookmark). "walk-in" = registered at the gate. Anything marked "not created here" arrived with a tag you did not create in this list (for example a campaign someone tagged by hand).</p>';
};
AFTER.sources=()=>{
  const inp=$('#newName'); if(!inp) return;
  const slugOf=v=>v.toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  inp.oninput=()=>{ const s=slugOf(inp.value); $('#newPrev').innerHTML=s?(D.settings.site?'<code>'+esc(siteLink(s))+'</code>':'Save your website address first, then the link appears here. Name: <code>'+esc(s)+'</code>'):'The link will appear here.'; };
};
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='saveSet'){ t.disabled=true; try{ await api('settings',{site:$('#setSite').value.trim(),form:$('#setForm').value.trim()}); await load(); draw(true); }catch(x){ alert(x.message); } t.disabled=false; }
  if(t.id==='addSrc'){ const name=$('#newName').value.trim(); if(!name){ $('#newMsg').textContent='Give the link a name.'; return; } t.disabled=true; $('#newMsg').textContent='';
    try{ await api('src_add',{label:name,slug:name,notes:$('#newNote').value.trim()}); await load(); draw(true); }catch(x){ $('#newMsg').textContent=x.message; } t.disabled=false; }
  const cp=t.closest('[data-copy]'); if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); const o=cp.textContent; cp.textContent='Copied ✓'; setTimeout(()=>cp.textContent=o,1400); }catch(x){ prompt('Copy this link:',cp.dataset.copy); } }
  const qr=t.closest('[data-qr]'); if(qr){ const link=siteLink(qr.dataset.qr); const c=D.sources.find(s=>s.slug===qr.dataset.qr);
    $('#sheet').innerHTML='<h2 style="font-size:18px">QR code: '+esc(c?c.label:qr.dataset.qr)+'</h2><p class="muted" style="margin:4px 0 12px">Print it on a poster, standee or flyer. Scanning opens this source\'s link.</p><div id="qrBox" style="background:#fff;padding:14px;display:inline-block;border:2px solid var(--ink);border-radius:14px"></div><p style="margin:10px 0;word-break:break-all"><code>'+esc(link)+'</code></p><div class="linkrow"><button class="btn sm" id="qrDl">Download PNG</button><button class="btn sm ghost" data-close>Close</button></div>';
    $('#modal').classList.add('open'); new QRCode($('#qrBox'),{text:link,width:300,height:300,correctLevel:QRCode.CorrectLevel.M});
    $('#qrDl').onclick=()=>{ const cv=$('#qrBox canvas'); const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='qr-'+qr.dataset.qr+'.png'; a.click(); }; }
  const ds=t.closest('[data-delsrc]'); if(ds&&confirm('Remove the link "'+ds.dataset.delsrc+'" from this list? Past visits and registrations are kept. The link itself will keep working.')){ try{ await api('src_del',{slug:ds.dataset.delsrc}); await load(); draw(true); }catch(x){ alert(x.message); } }
  if(t.closest('[data-close]')||t.id==='modal') $('#modal').classList.remove('open');
});

/* ===== Registrations ===== */
function filteredStudents(){
  const q=ST.rq.toLowerCase();
  return D.students.filter(s=>{
    if(ST.rsrc&&s.src!==ST.rsrc) return false; if(ST.rrole&&s.role!==ST.rrole) return false;
    if(ST.rstat==='in'&&s._checked!=='Yes') return false; if(ST.rstat==='not'&&s._checked==='Yes') return false; if(ST.rstat==='share'&&s.consent_share!=='Yes') return false; if(ST.rstat==='walk'&&s._via!=='Walk-in') return false;
    if(q&&!(s.name+' '+s.phone+' '+s.email+' '+s.ref+' '+s.city+' '+s.institution).toLowerCase().includes(q)) return false; return true; }).sort((a,b)=>b.ts.localeCompare(a.ts));
}
VIEW.regs=()=>{
  const srcs=[...new Set(D.students.map(s=>s.src))].sort(), roles=[...new Set(D.students.map(s=>s.role).filter(Boolean))].sort();
  const sel=(id,cur,opts,all)=>'<select id="'+id+'"><option value="">'+all+'</option>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
  return '<div class="toolbar"><input type="search" id="rq" placeholder="Search name, mobile, email, code, city, school" value="'+esc(ST.rq)+'">'+
    sel('rsrc',ST.rsrc,srcs.map(s=>[s,s]),'All sources')+sel('rrole',ST.rrole,roles.map(s=>[s,s]),'Everyone')+
    sel('rstat',ST.rstat,[['in','Checked in'],['not','Not arrived yet'],['share','Agreed to share with colleges'],['walk','Walk-ins']],'Any status')+
    '<button class="btn sm ghost" id="rcsv">Export CSV</button><button class="btn sm" id="rwa">Export for WhatsApp platform</button><button class="btn sm ghost" id="rcopy">Copy mobile numbers</button></div><div id="rcount" class="muted" style="margin-bottom:8px"></div><div class="tw" id="rtbl"></div>';
};
function drawRegs(){
  const L=filteredStudents(); $('#rcount').textContent=L.length+' of '+D.students.length+' registrations · '+L.reduce((a,s)=>a+s.party,0)+' people';
  $('#rtbl').innerHTML='<table><thead><tr><th>Registered</th><th>Name</th><th>Mobile</th><th>Email</th><th>City</th><th>Role</th><th>Studying</th><th class="n">People</th><th>Source</th><th class="n">Time on site</th><th>Heard via</th><th>Status</th></tr></thead><tbody>'+
    (L.slice(0,500).map(s=>'<tr class="click" data-stu="'+esc(s.ref)+'"><td>'+esc(dt(s.ts))+'</td><td><b>'+esc(s.name)+'</b><div class="muted" style="font-size:11px">'+esc(s.ref)+'</div></td><td>'+esc(s.phone)+'</td><td>'+esc(s.email)+'</td><td>'+esc(s.city)+'</td><td>'+esc(s.role)+'</td><td>'+esc(s.studying)+'</td><td class="n">'+s.party+'</td><td><span class="tag pk">'+esc(s.src)+'</span></td><td class="n">'+(s.secs_before?dur(s.secs_before):'-')+'</td><td>'+esc(s.heard)+'</td><td>'+(s._checked==='Yes'?'<span class="tag ok">in · '+esc(dt(s._checkin_time))+'</span>':'<span class="tag">not yet</span>')+'</td></tr>').join('')||'<tr><td colspan="12" class="empty">No registrations match.</td></tr>')+'</tbody></table>'+(L.length>500?'<div class="empty">Showing the latest 500. Narrow the filters or export to see all.</div>':'');
}
AFTER.regs=()=>{
  drawRegs();
  const bind=(id,k)=>{ $('#'+id).oninput=$('#'+id).onchange=e=>{ ST[k]=e.target.value; drawRegs(); }; };
  bind('rq','rq'); bind('rsrc','rsrc'); bind('rrole','rrole'); bind('rstat','rstat');
  $('#rcsv').onclick=()=>csv(filteredStudents(),[['Reference','ref'],['Registered','ts'],['Name','name'],['Mobile','phone'],['Email','email'],['City','city'],['Registering as','role'],['Studying','studying'],['School / college','institution'],['Interests','interests'],['Exams','exams'],['Question','question'],['Coming with','coming_with'],['People','party'],['Wants','wants'],['Heard via','heard'],['Consent: updates','consent_contact'],['Consent: share with institutions','consent_share'],['Source','src'],['Medium','medium'],['Campaign','campaign'],['Referrer','referrer'],['Device','device'],['Seconds on site before registering','secs_before'],['Registered via','_via'],['Checked in','_checked'],['Check-in time','_checkin_time'],['Checked in by','_checkin_by']],'registrations');
  $('#rwa').onclick=()=>{
    const e164=p=>{ let d=String(p).replace(/\D/g,''); if(d.length>10&&d.indexOf('91')===0) d=d.slice(2); return '+91'+d.slice(-10); };
    csv(filteredStudents(),[['first_name',s=>String(s.name).trim().split(/\s+/)[0]],['full_name','name'],['phone_e164',s=>e164(s.phone)],['phone_10_digit',s=>e164(s.phone).slice(3)],['email','email'],['pass_code','ref'],['people_on_pass','party'],['city','city'],['registering_as','role'],['studying','studying'],['interests','interests'],['source','src'],['checked_in',s=>s._checked==='Yes'?'Yes':'No'],['event_name',()=>D.event.name],['event_date',()=>D.event.date],['event_time',()=>D.event.time],['event_venue',()=>D.event.venue]],'whatsapp-contacts');
  };
  $('#rcopy').onclick=async()=>{ const t=filteredStudents().map(s=>s.phone).join('\n'); try{ await navigator.clipboard.writeText(t); $('#rcopy').textContent='Copied ✓'; setTimeout(()=>$('#rcopy').textContent='Copy mobile numbers',1400); }catch(e){ prompt('Copy:',t); } };
};
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-stu]'); if(!r) return;
  const s=D.students.find(x=>x.ref===r.dataset.stu); if(!s) return; const v=sessionOf(s);
  const kv=(a,b)=>b!==''&&b!=null?'<dt>'+a+'</dt><dd>'+esc(b)+'</dd>':'';
  const secs=v?Object.entries(v.secs||{}).sort((a,b)=>b[1]-a[1]).map(([k,n])=>(SEC[k]||k)+': '+dur(n)).join(' · '):'';
  $('#sheet').innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="font-size:20px">'+esc(s.name)+'</h2><div class="muted">'+esc(s.ref)+' · registered '+esc(dt(s.ts))+'</div></div><button class="btn sm ghost" data-close>Close</button></div>'+
    '<dl class="kv">'+kv('Mobile',s.phone)+kv('Email',s.email)+kv('City',s.city)+kv('Registering as',s.role)+kv('Studying',s.studying)+kv('School / college',s.institution)+kv('Interested in',s.interests)+kv('Exams',s.exams)+kv('Their question',s.question)+kv('Coming with',s.coming_with)+kv('People on pass',s.party)+kv('Wants',s.wants)+kv('Heard via',s.heard)+kv('Updates consent',s.consent_contact)+kv('Share with colleges',s.consent_share)+
    kv('Source',s.src+(s.medium?' / '+s.medium:'')+(s.campaign?' / '+s.campaign:''))+kv('Came from',s.referrer)+kv('Device',s.device)+kv('Registered via',s._via)+kv('Time on site before registering',s.secs_before?dur(s.secs_before):'')+
    (v?kv('That visit',dur(v.open)+' open · '+dur(v.active)+' reading · scrolled '+v.scroll+'%')+kv('Time per section',secs)+kv('Buttons clicked',Object.keys(v.clicks||{}).join(', ')):'')+
    kv('Checked in',s._checked==='Yes'?dt(s._checkin_time)+' by '+s._checkin_by:'Not yet')+'</dl>'+
    '<div class="linkrow" style="margin-top:16px">'+(s._checked==='Yes'?'<button class="btn sm danger" data-act="undo" data-ref="'+esc(s.ref)+'">Undo check-in</button>':'<button class="btn sm" data-act="checkin" data-ref="'+esc(s.ref)+'">Mark as arrived</button>')+'<a class="btn sm ghost" style="text-decoration:none" href="https://wa.me/91'+String(s.phone).replace(/\D/g,'').slice(-10)+'" target="_blank" rel="noopener">WhatsApp them</a></div>';
  $('#modal').classList.add('open');
});
document.addEventListener('click',async e=>{ const b=e.target.closest('[data-act]'); if(!b) return; b.disabled=true;
  try{ await api(b.dataset.act,{ref:b.dataset.ref,by:'Admin'}); await load(); $('#modal').classList.remove('open'); draw(true); }catch(x){ alert(x.message); b.disabled=false; } });

/* ===== Visits ===== */
function filteredVisits(){ return D.visits.filter(v=>(!ST.vsrc||v.src===ST.vsrc)&&(!ST.vreg||(ST.vreg==='y'?v.reg:!v.reg))).sort((a,b)=>String(b.first).localeCompare(String(a.first))); }
VIEW.visits=()=>{
  const srcs=[...new Set(D.visits.map(v=>v.src))].sort();
  return '<div class="toolbar"><select id="vsrc"><option value="">All sources</option>'+srcs.map(s=>'<option'+(s===ST.vsrc?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'+
    '<select id="vreg"><option value="">Everyone</option><option value="y"'+(ST.vreg==='y'?' selected':'')+'>Registered</option><option value="n"'+(ST.vreg==='n'?' selected':'')+'>Left without registering</option></select>'+
    '<button class="btn sm ghost" id="vcsv">Export CSV</button></div><div id="vcount" class="muted" style="margin-bottom:8px"></div><div class="tw" id="vtbl"></div>';
};
function drawVisits(){
  const L=filteredVisits(); $('#vcount').textContent=L.length+' visits';
  $('#vtbl').innerHTML='<table><thead><tr><th>When</th><th>Source</th><th>Came from</th><th>Device</th><th class="n">Open</th><th class="n">Reading</th><th class="n">Scroll</th><th>Longest on</th><th>Clicked</th><th class="n">Form step</th><th>Registered</th></tr></thead><tbody>'+
    (L.slice(0,ST.vmax).map(v=>'<tr><td>'+esc(dt(v.first))+(v.ret==='Y'?' <span class="tag">returning</span>':'')+'</td><td><span class="tag pk">'+esc(v.src)+'</span></td><td>'+esc(v.referrer)+'</td><td>'+esc(v.device)+' · '+esc(v.browser)+'</td><td class="n">'+dur(v.open)+'</td><td class="n">'+dur(v.active)+'</td><td class="n">'+v.scroll+'%</td><td>'+esc(topSec(v))+'</td><td>'+esc(Object.keys(v.clicks||{}).join(', '))+'</td><td class="n">'+(v.form==='Y'?(v.step||'opened'):'-')+'</td><td>'+(v.reg?'<span class="tag ok">'+esc(v.reg)+'</span>':'')+'</td></tr>').join('')||'<tr><td colspan="11" class="empty">No visits yet.</td></tr>')+'</tbody></table>'+(L.length>ST.vmax?'<div class="empty"><button class="btn sm" id="vmore">Show 200 more</button></div>':'');
  const m=$('#vmore'); if(m) m.onclick=()=>{ ST.vmax+=200; drawVisits(); };
}
AFTER.visits=()=>{ drawVisits(); $('#vsrc').onchange=e=>{ ST.vsrc=e.target.value; ST.vmax=200; drawVisits(); }; $('#vreg').onchange=e=>{ ST.vreg=e.target.value; ST.vmax=200; drawVisits(); };
  $('#vcsv').onclick=()=>csv(filteredVisits(),[['Session','sid'],['First seen','first'],['Last seen','last'],['Visitor','vid'],['Returning','ret'],['Source','src'],['Medium','medium'],['Campaign','campaign'],['Referrer','referrer'],['Device','device'],['Browser','browser'],['Screen','screen'],['Seconds open','open'],['Seconds reading','active'],['Scroll %','scroll'],['Seconds per section',v=>JSON.stringify(v.secs)],['Clicks',v=>JSON.stringify(v.clicks)],['Opened form','form'],['Form step','step'],['Registered','reg']],'visits'); };

/* ===== Audience ===== */
VIEW.audience=()=>{
  const S=D.students, split=k=>S.flatMap(s=>String(s[k]||'').split(', ').filter(Boolean));
  const b=(t,h,rows,cls)=>'<div class="box"><h3>'+t+'</h3><div class="hint">'+h+'</div>'+(rows.length?bars(rows,S.length,cls):'<div class="empty">No data yet.</div>')+'</div>';
  const shared=S.filter(s=>s.consent_share==='Yes').length;
  return '<div class="note">This is the profile you can show exhibitors: who is coming, what they want to study, and what they want to ask. <b>'+shared+'</b> of '+S.length+' registrants ('+pct(shared,S.length)+') agreed to have their details shared with participating institutions.</div>'+
    '<div class="grid cols">'+b('Registering as','Who signed up',count(S.map(s=>s.role)))+b('Currently studying','Class / course',count(S.map(s=>s.studying)),'alt')+
    b('Design fields of interest','Each person can pick several',count(split('interests')).slice(0,10),'ol')+b('Entrance exams','Preparing for',count(split('exams')))+
    b('City / district','Top 12',count(S.map(s=>String(s.city).trim().replace(/\b\w/g,c=>c.toUpperCase()))).slice(0,12),'alt')+b('What they want to do','On the day',count(split('wants')),'ol')+
    b('How they heard','Self-reported',count(S.map(s=>s.heard)))+b('Coming with','Group size',count(S.map(s=>s.coming_with)),'alt')+
    '<div class="box"><h3>Questions people want answered</h3><div class="hint">Latest 20: useful for briefing exhibitors</div>'+(S.filter(s=>s.question).slice(-20).reverse().map(s=>'<p style="margin:0 0 8px;font-size:13px">“'+esc(s.question)+'” <span class="muted">· '+esc(s.role)+', '+esc(s.city)+'</span></p>').join('')||'<div class="empty">None yet.</div>')+'</div></div>';
};

/* ===== Check-in ===== */
VIEW.checkin=()=>{
  const S=D.students, chk=S.filter(s=>s._checked==='Yes'), pc=chk.reduce((a,s)=>a+s.party,0), pr=S.reduce((a,s)=>a+s.party,0);
  const hours=count(chk.map(s=>(s._checkin_time||'').slice(11,13)+':00')).sort((a,b)=>a[0].localeCompare(b[0]));
  const gates=count(chk.map(s=>s._checkin_by));
  const bySrc=Object.values(srcStats()).filter(s=>s.reg).sort((a,b)=>b.reg-a.reg).map(s=>[s.slug,s.chk,s.chk+' of '+s.reg+' · '+pct(s.chk,s.reg)]);
  const recent=chk.sort((a,b)=>String(b._checkin_time).localeCompare(String(a._checkin_time))).slice(0,50);
  return '<div class="grid kpis"><div class="kpi"><div class="n">'+chk.length+' / '+S.length+'</div><div class="l">Registrations checked in</div><div class="s">'+pct(chk.length,S.length)+' show-up</div></div>'+
    '<div class="kpi"><div class="n">'+pc+'</div><div class="l">People through the gate</div><div class="s">of '+pr+' expected</div></div>'+
    '<div class="kpi"><div class="n">'+(S.length-chk.length)+'</div><div class="l">Still to arrive</div></div>'+
    '<div class="kpi"><div class="n">'+S.filter(s=>s._via==='Walk-in').length+'</div><div class="l">Walk-ins</div></div></div>'+
    '<div class="note" style="margin-top:14px">Turn on <b>auto-refresh</b> (top right) to watch this live on the day. Scanning happens on the separate <b>Gate Scanner</b> page.</div>'+
    '<div class="grid cols"><div class="box"><h3>Arrivals by hour</h3><div class="hint">Check-ins</div>'+(hours.length?bars(hours):'<div class="empty">Nobody yet.</div>')+'</div>'+
    '<div class="box"><h3>By gate / scanner</h3><div class="hint">Who scanned</div>'+(gates.length?bars(gates,0,'alt'):'<div class="empty">Nobody yet.</div>')+'</div>'+
    '<div class="box"><h3>Reminder emails sent</h3><div class="hint">Automatic emails, one per person per slot</div>'+bars([['10 days before','d10'],['3 days before','d3'],['2 days before','d2'],['1 day before','d1'],['2 hours before','h2']].map(r=>[r[0],S.filter(s=>String(s._reminder||'').split(',').includes(r[1])).length,S.filter(s=>String(s._reminder||'').split(',').includes(r[1])).length+' of '+S.length]),0,'alt')+'</div>'+
    '<div class="box"><h3>Show-up by source</h3><div class="hint">Which links bring people who actually come</div>'+(bySrc.length?bars(bySrc,0,'ol'):'<div class="empty">No data.</div>')+'</div></div>'+
    '<h3 style="margin:20px 0 8px">Latest check-ins</h3><div class="tw"><table><thead><tr><th>Time</th><th>Name</th><th class="n">People</th><th>Mobile</th><th>Source</th><th>Gate</th></tr></thead><tbody>'+
    (recent.map(s=>'<tr class="click" data-stu="'+esc(s.ref)+'"><td>'+esc(dt(s._checkin_time))+'</td><td><b>'+esc(s.name)+'</b></td><td class="n">'+s.party+'</td><td>'+esc(s.phone)+'</td><td><span class="tag pk">'+esc(s.src)+'</span></td><td>'+esc(s._checkin_by)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">Nobody has been checked in yet.</td></tr>')+'</tbody></table></div>';
};
</script>
